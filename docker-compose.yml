services:
  lab:
    image: ${IMAGE_REPO:-registry.gitlab.com}/${IMAGE_NAME:-rigetti/qpu-hybrid-benchmark/quax}:${IMAGE_TAG:-quax}
    build:
      context: .
      dockerfile: Dockerfile
      args: # these should match your user id (linux only)
        UID: 1000
        GID: 1000
    volumes:
      - .:/home/rigetti/quax/
      - ${GIT_CONFIG_FILE:-~/.gitconfig}:/home/rigetti/.gitconfig
      - ${SSH:-~/.ssh}:/home/rigetti/.ssh
    ports:
      - ${JUPYTER_PORT:-8888}:${JUPYTER_PORT:-8888}
    command:
      - jupyter
      - lab
      - --LabApp.token=''
      - --ip=0.0.0.0
      - --no-browser
    # For GPU support, uncomment the following lines
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all # use `count: all` for all GPUs
    #           capabilities: [gpu]
